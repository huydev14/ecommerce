[opcache]
opcache.enable=1
; Hỗ trợ cho môi trường CLI (như queue runner, scheduler)
opcache.enable_cli=1

; Dung lượng bộ nhớ cấp phát cho OPcache (MB)
opcache.memory_consumption=256

; Dung lượng bộ nhớ dành cho lưu trữ chuỗi trùng lặp
opcache.interned_strings_buffer=16

; Số lượng file tối đa có thể lưu trong OPcache
opcache.max_accelerated_files=20000

; Tránh check file thay đổi định kỳ trên production để tăng tối đa hiệu năng
opcache.revalidate_freq=0
opcache.validate_timestamps=0

; Hỗ trợ preload cho Laravel nếu có (Laravel 8+)
; opcache.preload=/var/www/html/preload.php
; opcache.preload_user=www-data

opcache.fast_shutdown=1