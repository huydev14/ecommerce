[PHP]
# Thiết lập bộ nhớ và thời gian thực thi
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

# Kích thước file tải lên tối đa
upload_max_filesize = 100M
post_max_size = 100M

# Cài đặt múi giờ mặc định khớp với .env
date.timezone = "Asia/Ho_Chi_Minh"

# Bảo mật nâng cao
expose_php = Off
cgi.fix_pathinfo = 0

# Cấu hình báo lỗi trên môi trường production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
variables_order = "GPCS"
