server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php;

    charset utf-8;

    # Nén Gzip tối ưu dung lượng truyền tải
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Cấu hình cache cho tài nguyên tĩnh
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|otf|woff|woff2|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Tăng timeout cho các request lâu (như export dữ liệu)
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Chặn truy cập vào các file ẩn và file cấu hình nhạy cảm
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Thiết lập kích thước tải lên tối đa trùng khớp với cấu hình php.ini
    client_max_body_size 100M;
}
