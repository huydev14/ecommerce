name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy code via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: trgiahuy_usr
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/trgiahuy_usr/data/www/ecommerce.giahuy.tech
            git pull origin main
            ./deploy.sh