services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-giahuy-web:latest
    container_name: ecommerce-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ecommerce-shared-storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-giahuy-web:latest
    container_name: ecommerce-worker
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - .env
    volumes:
      - ecommerce-shared-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ecommerce-db-data:/var/lib/mysql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    volumes:
      - ecommerce-redis-data:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ecommerce-net:
    driver: bridge

volumes:
  ecommerce-db-data:
    driver: local
  ecommerce-redis-data:
    driver: local
  ecommerce-shared-storage:
    driver: local