services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-giahuy-web:latest
    container_name: ecommerce-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:443"
    volumes:
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ecommerce-shared-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    networks:
      - shared-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-giahuy-web:latest
    container_name: ecommerce-worker
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - .env
    volumes:
      - ecommerce-shared-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-net

volumes:
  ecommerce-shared-storage:
    driver: local