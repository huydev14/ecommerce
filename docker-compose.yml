services:
  # Dịch vụ Web Laravel (chạy đồng thời Nginx và PHP-FPM qua Supervisor)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-giahuy-web:latest
    container_name: ecommerce-web
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-workhub}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      RUN_MIGRATIONS: "true" # Tự động chạy migrate khi khởi động
    depends_on:
      - db
      - redis
    networks:
      - ecommerce-net

  # Dịch vụ Hàng đợi (Queue Worker chạy Laravel Horizon)
  # Sử dụng chung Image đã build của web giúp tiết kiệm tài nguyên và đồng bộ mã nguồn tuyệt đối
  worker:
    image: ecommerce-giahuy-web:latest
    container_name: ecommerce-worker
    restart: unless-stopped
    command: php artisan horizon
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-workhub}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      - db
      - redis
      - web
    networks:
      - ecommerce-net

  # Dịch vụ Cơ sở dữ liệu MySQL 8.0
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-workhub}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - ecommerce-db-data:/var/lib/mysql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dịch vụ Redis Cache & Queue
  redis:
    image: redis:alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ecommerce-redis-data:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ecommerce-net:
    driver: bridge

volumes:
  ecommerce-db-data:
    driver: local
  ecommerce-redis-data:
    driver: local
